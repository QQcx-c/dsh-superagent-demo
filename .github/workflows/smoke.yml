name: smoke-trigger
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: comment on issue 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "@QQcx-c 把 README 的标题下面加一句：Triggered by wy."
